<!doctype html>
<html lang="ja">
<head>

<title>DIFF. | FORM — ちがいが、かたちになる。</title>
<style>
:root{--ink:#091720;--deep:#0e222d;--tile:clamp(49px,calc((100vw - 44px)/5.28),62px);--spacing:clamp(4px,1.7vw,8px);--aqua:#b4f4e9;--sea:#6dd7cb;--honey:#e8c69a;--text:#eaf7f4;--muted:#94afb2;--stroke:rgba(192,244,235,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--ink);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP',system-ui,sans-serif}
body{overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid #b4f4e9;outline-offset:3px}button:disabled{cursor:default;opacity:.4}
#app{min-height:100svh;min-height:100dvh;max-width:480px;margin:0 auto;position:relative;display:flex;flex-direction:column;overflow:hidden;isolation:isolate;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}

.header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 10px;min-height:66px;flex:0 0 auto}
.brand{display:flex;align-items:baseline;gap:9px;border:0;background:transparent;padding:0;color:#eafff7;text-align:left}
.brand strong{font-size:23px;font-weight:740;letter-spacing:-.075em;line-height:1}
.brand em{font:500 9px/1 ui-monospace,SFMono-Regular,monospace;letter-spacing:.28em;color:#80bcb8;font-style:normal}
.header-tools{display:flex;align-items:center;gap:8px}.icon-btn{width:38px;height:38px;display:grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:12px;color:#a1c6c7;transition:background .2s,border .2s,color .2s}.icon-btn:hover,.icon-btn.active{background:rgba(141,232,219,.08);border-color:rgba(152,228,218,.15);color:#effff8}.icon-btn svg{height:19px;width:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.explore-pill{padding:7px 12px;border-radius:99px;border:1px solid rgba(151,220,210,.17);background:rgba(121,214,204,.06);color:#b5e7e0;font:650 10px/1.1 ui-monospace,monospace;letter-spacing:.12em;transition:background .2s}
.explore-pill.active{background:rgba(129,240,220,.16);border-color:rgba(143,244,230,.42);color:#e3fff5}
.progress-wrap{height:3px;background:rgba(159,231,223,.075);margin:0 23px;overflow:hidden;border-radius:9px;flex:0 0 auto}
.progress{height:100%;background:linear-gradient(90deg,#427f8a,#a8eeda);border-radius:9px;width:2%;transition:width .55s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 12px rgba(102,246,221,.27)}
.goal-area{height:150px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;position:relative}
.goal-area:after{content:'';position:absolute;width:195px;height:88px;left:50%;top:42px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,rgba(226,176,122,.07),transparent 70%);pointer-events:none}
.goal-label{font-size:11px;letter-spacing:.18em;color:#93b3b6;font-weight:620}
.goal-tile{width:var(--tile);height:var(--tile);border-radius:15px;background:linear-gradient(155deg,rgba(228,197,159,.11),rgba(234,195,146,.025));border:1px solid rgba(243,209,158,.32);display:grid;place-items:center;position:relative;z-index:1;box-shadow:0 0 35px rgba(243,201,145,.07),inset 0 1px 0 rgba(255,241,215,.05)}
.goal-tile.bloom{animation:targetBloom 1.05s ease-out}.goal-tile .stick{background:linear-gradient(90deg,#ebc48f,#fff0ce);box-shadow:0 0 12px rgba(246,198,137,.25),0 0 3px rgba(255,231,196,.4)}
.goal-subtitle{font-size:10px;letter-spacing:.035em;color:#638a93;min-height:14px}
.board-scene{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:4px 12px 6px;position:relative}
.scene-title{margin-bottom:22px;color:#79a4ac;letter-spacing:.19em;font-size:10px;font-weight:650;display:flex;gap:11px;align-items:center}
.scene-title:before,.scene-title:after{content:'';width:24px;height:1px;background:linear-gradient(90deg,transparent,rgba(171,222,221,.25))}.scene-title:after{transform:rotate(180deg)}
.board{position:relative;width:100%;height:auto;display:flex;flex-direction:column;gap:clamp(10px,2.2vh,17px);align-items:center;justify-content:center;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.board-row{display:flex;align-items:center;justify-content:center;gap:var(--spacing);position:relative;z-index:2}
.cell{width:var(--tile);height:var(--tile);flex:none;border-radius:15px;display:flex;justify-content:center;align-items:center;position:relative;overflow:hidden;transition:border-color .24s,background .24s,opacity .2s,box-shadow .24s}
.cell.playable{border:1px solid rgba(204,252,244,.26);background:linear-gradient(150deg,rgba(202,249,239,.14),rgba(114,199,202,.055));box-shadow:inset 0 1px 0 rgba(235,255,248,.10);touch-action:none;cursor:grab;will-change:transform}
.cell.playable:hover{border-color:rgba(190,252,233,.52)}.cell.playable.selected{outline:1.5px solid #d2fff0;outline-offset:3px;border-color:#b8f2e4;background:rgba(129,214,203,.16)}.cell.playable.locked{border-color:rgba(186,221,215,.14);background:rgba(159,219,209,.035);cursor:default}.cell.playable.locked:after{content:'';position:absolute;right:8px;top:8px;width:4px;height:4px;border-radius:50%;background:#bd9b70;opacity:.75}
.cell.playable.drag-source{opacity:.22}.cell.playable.drag-target{border-color:#a6f5e4;box-shadow:0 0 18px rgba(98,243,209,.16)}
.cell.ghost{border:1px solid rgba(170,221,225,.10);background:rgba(89,155,169,.035)}
.cell.ghost:before{content:'';position:absolute;width:22%;height:2px;border-radius:2px;background:rgba(129,174,186,.19);transition:opacity .18s}.cell.ghost.revealed:before{opacity:0}.cell.ghost.revealed{background:rgba(122,215,206,.072);border-color:rgba(175,237,219,.20)}.cell.ghost.final.revealed{background:linear-gradient(150deg,rgba(90,199,181,.21),rgba(58,150,148,.08));border-color:rgba(157,249,224,.50);box-shadow:0 0 24px rgba(61,221,186,.10)}
.cell.pulse{animation:cellPulse .3s ease-out}.cell.born{animation:bornCell .42s cubic-bezier(.13,.76,.22,1.15) both}.cell.ghost.delta{border-color:rgba(244,209,158,.46);box-shadow:inset 0 0 16px rgba(233,173,93,.09)}
.bar-lane{width:79%;height:17px;position:relative;display:flex;align-items:center;justify-content:flex-start;overflow:visible;border-left:1px solid rgba(202,252,243,.22);padding-left:0}
.bar-lane:after{content:'';position:absolute;left:0;right:0;top:calc(50% - .5px);height:1px;background:rgba(146,207,210,.08);pointer-events:none}
.stick{position:relative;z-index:1;width:0;height:8px;flex:none;border-radius:100px;background:linear-gradient(180deg,#e0fff8 0%,#a2e9de 88%);box-shadow:0 0 12px rgba(109,241,219,.18),0 0 2px rgba(184,255,240,.35);transform-origin:left center;transition:width .42s cubic-bezier(.18,.85,.2,1),filter .3s}
.stick.zero{width:5px!important;height:5px;box-shadow:0 0 9px rgba(110,237,212,.38)}
.cell.ghost:not(.revealed) .stick{width:0!important;opacity:0}.cell.ghost .stick{height:7px;background:linear-gradient(180deg,#96e8dd,#55c5bd)}.cell.ghost.final .stick{background:linear-gradient(180deg,#dafff4,#8cf0dc);box-shadow:0 0 12px rgba(118,244,222,.3)}
.board-lines{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:3;overflow:visible}.flash-thread{fill:none;stroke:#90efda;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:80;stroke-dashoffset:80;animation:thread .41s ease forwards;filter:drop-shadow(0 0 3px rgba(120,255,224,.9))}
.drag-float{position:fixed!important;z-index:999!important;pointer-events:none!important;box-shadow:0 18px 42px rgba(2,8,13,.35),0 0 22px rgba(133,246,225,.12),inset 0 1px 0 rgba(235,255,248,.15)!important;transform:scale(1.06);will-change:left,top;transition:none!important}
.swap-clone{position:fixed!important;z-index:99!important;pointer-events:none!important;will-change:transform,opacity;transition:none!important}
.feedback{min-height:45px;width:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;margin-top:21px;text-align:center}
.feedback strong{font-weight:670;font-size:17px;letter-spacing:.055em;color:#e5fdf4}.feedback small{color:#90b9b9;font-size:11px;line-height:1.5}.feedback.good strong{color:#b9ffe8}.feedback.bad strong{color:#e5c29e}
.footer{padding:10px 23px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;flex:0 0 auto}
.actions{display:flex;gap:10px;align-items:center}.main-btn{min-height:56px;flex:1;border:1px solid rgba(181,251,229,.28);border-radius:16px;background:linear-gradient(110deg,#b8f5e7,#8ae6d3);color:#143840;letter-spacing:.08em;font-size:14px;font-weight:760;display:flex;align-items:center;justify-content:center;gap:12px;position:relative;overflow:hidden;box-shadow:0 8px 25px rgba(67,223,198,.10);transition:transform .13s,filter .2s}.main-btn:active{transform:scale(.98)}.main-btn:after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.3) 50%,transparent 65%);transform:translateX(-130%);pointer-events:none}.main-btn:enabled:hover:after{transition:transform .85s;transform:translateX(130%)}.main-btn:disabled{opacity:.58}
.secondary-btn{height:56px;width:56px;display:grid;place-items:center;border-radius:16px;border:1px solid rgba(160,231,218,.20);background:rgba(118,220,202,.055);color:#b6e5de;transition:background .2s}.secondary-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.65;stroke-linejoin:round;stroke-linecap:round}.secondary-btn:active{background:rgba(148,246,220,.13)}
.footer-caption{text-align:center;min-height:15px;font-size:10px;letter-spacing:.03em;color:#668990}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 80px);max-width:calc(100vw - 60px);transform:translate(-50%,-8px);opacity:0;z-index:300;border:1px solid rgba(178,248,230,.19);border-radius:100px;background:rgba(15,41,49,.96);padding:9px 16px;white-space:nowrap;font-size:12px;box-shadow:0 10px 40px rgba(0,0,0,.26);transition:opacity .23s,transform .23s;pointer-events:none}#toast.visible{opacity:1;transform:translate(-50%,0)}
.backdrop{position:fixed;inset:0;z-index:120;background:rgba(3,12,18,.68);backdrop-filter:blur(8px);display:flex;justify-content:center;align-items:flex-end;padding:12px 10px env(safe-area-inset-bottom);opacity:0;pointer-events:none;transition:opacity .25s}.backdrop.open{opacity:1;pointer-events:auto}
.sheet{background:linear-gradient(158deg,#152f3a,#0e202b);border:1px solid rgba(180,238,227,.16);border-radius:24px 24px 18px 18px;width:100%;max-width:470px;max-height:78dvh;overflow-y:auto;padding:22px 22px 26px;box-shadow:0 18px 70px rgba(0,0,0,.45);transform:translateY(22px);transition:transform .28s cubic-bezier(.21,.86,.18,1)}.backdrop.open .sheet{transform:translateY(0)}
.sheet-top{display:flex;justify-content:space-between;align-items:center}.sheet h2{margin:0;font-size:18px;font-weight:680;letter-spacing:.08em}.sheet p{font-size:12px;color:#a9c9c9;line-height:1.95;margin:18px 0}.sheet-close{width:34px;height:34px;border:1px solid rgba(177,235,226,.18);background:rgba(167,232,220,.055);border-radius:11px;color:#a7d5cd;font-size:21px}
.mini-demo{padding:17px 12px;border-radius:17px;border:1px solid rgba(188,244,233,.13);background:rgba(6,28,37,.48);display:flex;align-items:center;flex-direction:column;gap:13px;margin-top:15px}
.demo-row{display:flex;gap:10px}.demo-box{height:39px;width:61px;border:1px solid rgba(157,234,220,.16);background:rgba(174,242,229,.06);border-radius:11px;display:flex;align-items:center;padding:8px;position:relative}.demo-box i{height:7px;border-radius:7px;display:block;background:#a8f5e6;box-shadow:0 0 12px rgba(146,250,223,.14)}.demo-box.small{width:61px}
.demo-caption{text-align:center;color:#9bc4c1;font-size:11px;line-height:1.7;margin-top:5px}
.stage-grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:7px;margin-top:18px}.stage-dot{aspect-ratio:1;border:1px solid rgba(160,224,220,.16);background:rgba(95,162,171,.08);border-radius:8px;padding:0;display:grid;place-items:center}.stage-dot:before{content:'';width:5px;height:5px;border-radius:100%;background:#618c91}.stage-dot.done{border-color:rgba(144,240,212,.32);background:rgba(109,229,190,.12)}.stage-dot.done:before{background:#b5f9df}.stage-dot.current{outline:1px solid #c2fff0;outline-offset:2px}.stage-dot:not(.done):not(.current){opacity:.8}.stage-dot:disabled{opacity:.23!important}
.sheet-action{width:100%;margin-top:18px;padding:13px;border-radius:12px;border:1px solid rgba(163,233,219,.21);background:rgba(146,222,206,.07);color:#d5f6eb;font-size:12px;font-weight:650}
.particle{position:absolute;left:50%;top:50%;height:3px;width:3px;border-radius:100%;background:#b2fbe2;pointer-events:none;z-index:12;box-shadow:0 0 7px 2px rgba(120,243,205,.33)}
@keyframes bornCell{0%{transform:translateY(-6px) scale(.86);opacity:.25}65%{transform:translateY(1px) scale(1.06);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes cellPulse{0%{filter:brightness(1)}60%{filter:brightness(1.6)}100%{filter:brightness(1)}}
@keyframes targetBloom{0%{box-shadow:0 0 0 rgba(244,208,153,0)}45%{box-shadow:0 0 36px rgba(244,208,153,.35)}100%{box-shadow:0 0 35px rgba(243,201,145,.07)}}
@keyframes thread{0%{stroke-dashoffset:80;opacity:.0}25%{opacity:1}65%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-15;opacity:0}}
@media(max-width:355px){:root{--tile:clamp(43px,calc((100vw - 39px)/5.29),55px);--spacing:5px}.header{padding:12px 15px 8px;min-height:56px}.progress-wrap{margin:0 17px}.goal-area{height:123px}.scene-title{margin-bottom:13px}.board{gap:9px}.feedback{margin-top:14px}.footer{padding:7px 17px max(11px,env(safe-area-inset-bottom))}.main-btn,.secondary-btn{min-height:51px;height:51px}}
@media(max-height:740px){.header{min-height:54px;padding-top:10px;padding-bottom:7px}.goal-area{height:115px;gap:5px}.board{gap:9px}.scene-title{margin-bottom:9px}.board-scene{padding:0 12px}.feedback{margin-top:10px;min-height:39px}.footer{gap:7px;padding-top:5px;padding-bottom:max(8px,env(safe-area-inset-bottom))}.main-btn,.secondary-btn{min-height:51px;height:51px}.footer-caption{min-height:12px}}
@media(max-height:630px){:root{--tile:clamp(42px,calc((100svh - 315px)/5.0),55px)}.goal-area{height:101px}.board{gap:5px}.scene-title{margin-bottom:5px}.feedback{margin-top:5px}.footer-caption{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

function shuffle(a){let s=a.slice();for(let i=s.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[s[i],s[j]]=[s[j],s[i]]}return s}
function toggleFlow(force){const desired=typeof force==='boolean'?force:!flow;if(desired===flow)return;revToken++;flow=desired;selected=-1;state='ready';lastRows=null;if(flow){seq=flowSeq.slice();draw(true)}else{flowSeq=seq.slice();initialLevel(current)}updateText();note('swap')}
function handleMain(){ctx();if(flow){shuffleFlow();return}if(state==='revealing'){fastReveal();return}if(state==='won'){if(current===LEVELS.length-1){toggleFlow(true);toast('ぜんぶの光を見つけた！');return}setLevel(current+1);note('swap');return}reveal()}
function hintCopy(p){switch(p.topic){case 'equal':return '左右の「ちがい」を同じ長さにすると、最後は点になるよ。';case 'near':return '下の棒同士の長さが近くなる並べ方を考えてみよう。';case 'extreme':return 'いちばん短い棒を真ん中に置いたら、何が変わるかな？';case 'zero':return 'となりの差がそろうように並べると、その先には点ができる。';case 'chain':return '最初の段だけじゃなく、その先の段も頭の中で描いてみよう。';case 'guided':return '小さな印のある棒は固定。動かせる棒の並びを考えてみよう。';case 'parity5':return '両端の棒に注目。端を決めてから、真ん中を整えてみよう。';case 'zero5':return 'どこかに、同じ長さの差が並ぶ場所を作れないかな？';case 'large':return '大きな差と小さな差を、別々の場所に作ってみよう。';case 'reverse':return 'いちばん下の棒を生むには、すぐ上にどんな組合せが必要？';default:return 'これまで見つけた規則を、いくつか組み合わせてみよう。'}}
function openPanel(title,html){els.modalTitle.textContent=title;els.modalBody.innerHTML=html;els.modal.classList.add('open');els.modal.setAttribute('aria-hidden','false')}
function closePanel(){els.modal.classList.remove('open');els.modal.setAttribute('aria-hidden','true')}
function hint(){if(flow){seq=[1,3,5,7,9];draw(true);updateText();note('swap');return}openPanel('小さなヒント',`<p>${hintCopy(LEVELS[current])}</p><div class="mini-demo"><div class="demo-row"><div class="demo-box"><i style="width:80%"></i></div><div class="demo-box"><i style="width:36%"></i></div></div><div style="color:#9fe9d9;font-size:18px">↓</div><div class="demo-row"><div class="demo-box small"><i style="width:44%"></i></div></div><div class="demo-caption">長い棒から短い棒を引いた「残り」が、次の棒になる。</div></div>`)}
function showInfo(){openPanel('ちがいのかたち',`<p>となりあう光の棒を見くらべると、その<strong style="color:#e4fff4">長さのちがい</strong>が下の段に現れます。最後の光を、お手本と同じ長さにできたら成功。</p><div class="mini-demo"><div class="demo-row"><div class="demo-box"><i style="width:80%"></i></div><div class="demo-box"><i style="width:36%"></i></div></div><div style="color:#9fe9d9;font-size:18px">↓</div><div class="demo-row"><div class="demo-box"><i style="width:44%"></i></div></div><div class="demo-caption">棒はドラッグか、ふたつタップで交換。<br>答えを見る前に、下の形を想像してみよう。</div></div><p>FLOWは、棒を動かすたびに差が生まれる自由あそび。正解も不正解もありません。</p><button class="sheet-action" id="chooseStages">光を選ぶ</button>`);$('#chooseStages').addEventListener('click',showStages)}
function showStages(){const unlocked=done.length?Math.max(...done)+1:0;const grid=LEVELS.map((p,i)=>`<button class="stage-dot ${done.includes(i)?'done':''}${current===i?' current':''}" data-stage="${i}" ${i>unlocked?'disabled':''} aria-label="${i+1}番目の光"></button>`).join('');openPanel('光の記録',`<p>見つけた光は、淡く輝きます。好きな場所から、もう一度。</p><div class="stage-grid">${grid}</div><button id="resetLevel" class="sheet-action">この光をやり直す</button>`);$$('[data-stage]').forEach(el=>el.addEventListener('click',()=>{setLevel(Number(el.dataset.stage));closePanel()}));$('#resetLevel').addEventListener('click',()=>{setLevel(current);closePanel()})}
function toast(msg){clearTimeout(toastTimer);els.toast.textContent=msg;els.toast.classList.add('visible');toastTimer=setTimeout(()=>els.toast.classList.remove('visible'),2100)}
$('#checkBtn').addEventListener('click',handleMain);$('#hintBtn').addEventListener('click',hint);$('#flowToggle').addEventListener('click',()=>toggleFlow());$('#soundToggle').addEventListener('click',()=>{soundEnabled=!soundEnabled;safeStore('diff-form-sound-v1',soundEnabled);updateText();if(soundEnabled)note('swap')});$('#infoToggle').addEventListener('click',showInfo);$('#closeModal').addEventListener('click',closePanel);els.modal.addEventListener('click',e=>{if(e.target===els.modal)closePanel()});els.progressWrap.addEventListener('click',showStages);els.progressWrap.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showStages()}});$('#brand').addEventListener('click',()=>setLevel(current));document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});
initialLevel(current);
</script>
